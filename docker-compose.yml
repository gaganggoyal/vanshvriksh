services:
  web:
    build: .
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: file:/data/prod.db
      AUTH_SECRET: change-me-in-production-use-openssl-rand-hex-32
      APP_URL: http://localhost:3000
      EMAIL_DELIVERY: local
      ALLOW_DEMO: "true"
    volumes:
      - vansh-data:/data

volumes:
  vansh-data:
